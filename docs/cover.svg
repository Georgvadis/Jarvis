<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="Jarvis — кастомная прошивка и веб-панель Камин и Стекло">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120e0b"/>
      <stop offset="55%" stop-color="#1c140e"/>
      <stop offset="100%" stop-color="#331c0e"/>
    </linearGradient>
    <radialGradient id="hearth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2994a" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#d96b1f" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#120e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd2a6"/>
      <stop offset="45%" stop-color="#f2994a"/>
      <stop offset="100%" stop-color="#b85414"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="1310" cy="200" r="290" fill="url(#hearth)"/>

  <!-- Fireside ambient glass frame -->
  <rect x="44" y="34" width="1512" height="332" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>

  <!-- Station LED ring emblem -->
  <g transform="translate(1310 200)">
    <circle r="158" fill="none" stroke="#f2994a" stroke-opacity="0.09" stroke-width="1.5"/>
    <circle r="130" fill="none" stroke="#f2994a" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="10 10"/>
    <circle r="100" fill="none" stroke="url(#ring)" stroke-width="18"/>
    <circle r="68" fill="#140f0c" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
    <!-- Subtle voice wave bars inside core -->
    <g fill="#f2994a" opacity="0.9">
      <rect x="-26" y="-8" width="6" height="16" rx="3"/>
      <rect x="-14" y="-18" width="6" height="36" rx="3"/>
      <rect x="-2" y="-26" width="6" height="52" rx="3"/>
      <rect x="10" y="-14" width="6" height="28" rx="3"/>
      <rect x="22" y="-6" width="6" height="12" rx="3"/>
    </g>
  </g>

  <!-- Typography -->
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
    <text x="92" y="106" fill="#f2994a" font-size="16" font-weight="600" letter-spacing="4">JARVIS · YANDEX STATION LITE 2</text>
    <text x="88" y="218" fill="#f7f2ec" font-size="112" font-weight="800" letter-spacing="-4">Jarvis</text>
    <text x="92" y="274" fill="#cfc3b8" font-size="25" font-weight="400">Кастомная прошивка и панель «Камин и Стекло» для Яндекс Станции Лайт 2</text>
    <line x1="92" y1="316" x2="144" y2="316" stroke="#f2994a" stroke-width="3" stroke-linecap="round"/>
    <text x="160" y="322" fill="#9c8f83" font-size="15" font-weight="600" letter-spacing="2.5">RUST CORE · SVELTEKIT UI · ARM64 OTA</text>
  </g>
</svg>
