name: Build release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  station:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require release notes
        run: test -s "docs/releases/${GITHUB_REF_NAME#v}.md"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:panel
      - run: rustup update stable
      - run: rustup target add aarch64-unknown-linux-musl
      - run: sudo apt-get install -y libclang-dev zip
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: cargo test --locked --workspace --all-features --exclude jarvis-setup
        working-directory: jarvis
      - run: sh build.sh
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          STATION_ARCHES: arm64
          JARVIS_UI: ${{ github.workspace }}/build/ui/panel
      - uses: actions/upload-artifact@v4
        with:
          name: station
          path: build/release/
          if-no-files-found: error
  publish:
    needs: [station]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: station
          path: build/release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" build/release/* --verify-tag --title "Jarvis $GITHUB_REF_NAME" --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md"
          fi
